# ─── Arka Villa Management Platform — Production ─────────────
# Single-command deployment: docker compose up -d
#
# For local development without Docker, just use: npm run dev

version: "3.9"

services:
  app:
    build: .
    container_name: arka-villa-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
